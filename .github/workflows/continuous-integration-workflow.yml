name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      - name: Check generated Eva icons are up to date
        run: |
          yarn eva-icons:generate
          git diff --exit-code -- src/eva-icons/icons
          test -z "$(git ls-files --others --exclude-standard -- src/eva-icons/icons)"

      - run: yarn lint

      - run: yarn build

      - run: yarn typecheck

      - run: yarn typecheck:all

      - run: yarn test
