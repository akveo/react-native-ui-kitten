name: Release
on:
  push:
    branches: [master, next]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org

      # Pinned to a major on purpose. npm >= 11.5.1 is required for OIDC trusted
      # publishing, but `npm@latest` silently rolled the runner onto npm 12, whose
      # breaking `npm view --json` change (always returns an array) made changesets
      # misread every package as unpublished. See RELEASING.md.
      - run: npm install -g npm@12

      - run: yarn install --immutable

      - run: yarn build

      - uses: changesets/action@v1
        with:
          version: yarn version-packages
          publish: yarn release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
