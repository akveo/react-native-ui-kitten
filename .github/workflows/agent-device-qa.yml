name: Agent Device QA

on:
  workflow_dispatch:
  push:
    branches: [master, next, 'feat/**', 'fix/**']
    paths:
      - .github/workflows/agent-device-qa.yml
      - src/showcases/e2e/**
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [master, next]

concurrency:
  group: agent-device-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    # macOS minutes are expensive: run on manual dispatch, on pushes that touch the suite or this
    # workflow, or on PRs carrying the `agent-qa` label.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'agent-qa')
    runs-on: macos-15
    timeout-minutes: 90
    env:
      AGENT_DEVICE_VERSION: 0.21.0
      SIMULATOR_NAME: iPhone 16
      AGENT_DEVICE_PLATFORM: ios
      AGENT_DEVICE_SESSION: ci-ios
      AGENT_DEVICE_SESSION_LOCK: strip
      AGENT_DEVICE_DAEMON_TIMEOUT_MS: "180000"
      AGENT_DEVICE_IOS_BOOT_TIMEOUT_MS: "180000"
    steps:
      - uses: actions/checkout@v4

      - run: corepack enable
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - run: yarn install --immutable

      # Use the image's default Xcode: pinning an older one (16.2) selected an Xcode whose iOS
      # platform is not installed on the runner, so no simulator was an eligible destination.
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes available | tail -n +2

      - name: Boot simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | node -e '
            const d = JSON.parse(require("fs").readFileSync(0, "utf8")).devices;
            const all = Object.values(d).flat();
            const hit = all.find(x => x.name === process.env.SIMULATOR_NAME) ?? all.find(x => /^iPhone/.test(x.name));
            if (!hit) { console.error("no iPhone simulator"); process.exit(1); }
            process.stdout.write(hit.udid);
          ')
          xcrun simctl boot "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      # The build is split into explicit steps and throttled: a single `expo run:ios` on the
      # 3-core / 7 GB hosted runner starved it until GitHub dropped the connection, leaving no log.
      - name: Prebuild native project
        working-directory: src/showcases
        run: npx expo prebuild --platform ios --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            src/showcases/ios/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ runner.os }}-${{ hashFiles('src/showcases/ios/Podfile', 'yarn.lock') }}
          restore-keys: pods-${{ runner.os }}-

      - name: Install CocoaPods
        working-directory: src/showcases/ios
        run: pod install --deployment || pod install

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: src/showcases/ios/build
          key: derived-${{ runner.os }}-${{ hashFiles('src/showcases/ios/Podfile.lock') }}
          restore-keys: derived-${{ runner.os }}-

      - name: Build showcase app (Release simulator, bundle embedded)
        working-directory: src/showcases/ios
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -o pipefail
          xcodebuild \
            -workspace UIKittenShowcases.xcworkspace \
            -scheme UIKittenShowcases \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build \
            -jobs 2 \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build | tail -n 200

      - name: Install app on simulator
        run: |
          APP=$(find src/showcases/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          test -n "$APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"

      - name: Install agent-device
        run: |
          npm install -g "agent-device@${AGENT_DEVICE_VERSION}"
          agent-device --version

      # First `open` on a fresh runner builds agent-device's XCTest runner; do it before the suite so
      # the script's own waits only cover the app launch.
      - name: Pre-warm agent-device runner
        run: agent-device prepare ios-runner --platform ios --udid "${{ steps.sim.outputs.udid }}" --timeout 300000

      - name: Run replay suite
        run: |
          agent-device test src/showcases/e2e \
            --platform ios \
            --udid "${{ steps.sim.outputs.udid }}" \
            --retries 1 \
            --reporter default \
            --reporter junit:.agent-device/junit-ios.xml \
            --artifacts-dir .agent-device/test-artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-device-ios
          path: |
            .agent-device/junit-ios.xml
            .agent-device/test-artifacts
          if-no-files-found: warn
